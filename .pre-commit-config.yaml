# Local git hooks for the static-analysis toolchain.
#
# Install once:
#   .venv/bin/python -m pip install -r requirements-dev.txt
#   .venv/bin/pre-commit install
#
# Run against everything on demand:
#   .venv/bin/pre-commit run --all-files
#
# These hooks block a commit on SECURITY findings only (matching the CI gate):
#   - ruff --select S   security lint subset
#   - bandit            dedicated security linter
#   - semgrep           path-injection + security (run offline/local for speed;
#                       CI runs the full registry packs)
#
# The full ruff ALL ruleset (mostly style) is intentionally NOT a commit gate;
# run it on demand with `./scripts/analyze.sh ruff-all`.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        name: ruff (security subset)
        args: [--select, S]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        # Skip the test tree (matches pyproject exclude_dirs).
        exclude: ^src/universalchess/tests/

  - repo: local
    hooks:
      - id: semgrep-path-injection
        name: semgrep (path-injection + security, local rules)
        # language: system runs the entry as argv (so /usr/bin/env applies the
        # offline flag and execs analyze.sh). language: script would instead try
        # to execute the first token ("env") as a repo-relative file and fail.
        entry: env SEMGREP_OFFLINE=1 scripts/analyze.sh semgrep
        language: system
        pass_filenames: false
        types: [python]

      # Frontend security gate: only the XSS rules (no-unsanitized +
      # react/no-danger), mirroring the Python `ruff --select S` split. The full
      # `npm run lint` (style + react-hooks) has a backlog and is not gated here.
      - id: eslint-security
        name: eslint (frontend security rules)
        entry: bash -c 'cd src/universalchess/web-app && npm run --silent lint:security'
        language: system
        pass_filenames: false
        files: ^src/universalchess/web-app/.*\.(ts|tsx)$
