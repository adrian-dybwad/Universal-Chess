# Local git hooks for the static-analysis toolchain.
#
# Install once:
#   .venv/bin/python -m pip install -r requirements-dev.txt
#   .venv/bin/pre-commit install
#
# Run against everything on demand:
#   .venv/bin/pre-commit run --all-files
#
# The Python gate blocks a commit on SECURITY findings only: ruff --select S,
# bandit, and semgrep (local path-injection rules plus the registry packs).
#
# It runs `scripts/analyze.sh`, which is the same command the Static Analysis
# workflow runs, scoped the same way, with tool versions pinned in
# requirements-dev.txt that CI installs. That is deliberate and enforced by
# test_static_analysis_parity.py: this hook exists to tell you whether CI will
# pass, and it can only do that by running what CI runs. It previously ran
# semgrep with SEMGREP_OFFLINE=1 for speed, which cut the rule set from 405 to
# the 3 local ones, so commits passed here and failed on push.
#
# It therefore needs network access the first time, to fetch the registry packs;
# they are cached under .cache/semgrep afterwards. To commit without a network,
# run `SEMGREP_OFFLINE=1 git commit`, understanding that CI still applies the
# full set and may reject what passed.
#
# The report-only tool in the runner (`ruff-all`, the full mostly-stylistic
# ruleset over the whole tree) is left out here. It cannot change the outcome --
# CI never fails on it -- and it prints tens of thousands of findings. Run it on
# demand with `./scripts/analyze.sh ruff-all`.

repos:
  - repo: local
    hooks:
      - id: static-analysis
        name: ruff + bandit + semgrep (same as CI)
        # bash -c ... -- puts the committed filenames in "$@", which ANALYZE_FILES
        # takes as the scan scope, mirroring how the workflow passes the files
        # changed in the push. Without the trailing --, the first filename would
        # be consumed as $0 and silently excluded from the scan.
        entry: bash -c 'ANALYZE_FILES="$*" scripts/analyze.sh ruff-sec bandit semgrep' --
        language: system
        types: [python]

      # Frontend gate: the whole ruleset, which includes the XSS rules
      # (no-unsanitized + react/no-danger) that were once gated on their own
      # while the rest ran to a backlog of 44 findings. The backlog is cleared,
      # so there is nothing left to exempt, and `--max-warnings 0` also fails on
      # an eslint-disable that has outlived the finding it was written for.
      #
      # Unscoped by design: the whole tree is a few seconds, and the react-hooks
      # rules read a component with everything it calls, so a file-scoped run can
      # miss a finding a full run reports.
      - id: eslint
        name: eslint (same as CI)
        entry: bash -c 'cd src/universalchess/web-app && npm run --silent lint'
        language: system
        pass_filenames: false
        files: ^src/universalchess/web-app/.*\.(ts|tsx)$
