# Universal Chess: keep the persistent runtime swapfile a genuine safety valve.
#
# A low swappiness makes the kernel strongly prefer reclaiming page cache over
# paging out application memory, so at idle and during normal play the SD card is
# barely touched -- the swapfile only engages under real memory pressure (e.g.
# three or four engines loaded at once on a ~415MB board). This does NOT disable
# swap: when RAM is genuinely exhausted the kernel still swaps rather than OOM-
# killing an engine, which is the whole point of provisioning the swapfile. A high
# value would instead page hot engine memory to the slow card mid-search (latency)
# and wear the card continuously (writes), with no benefit -- the OOM protection
# comes from the swap existing, not from swapping eagerly.
vm.swappiness = 10
