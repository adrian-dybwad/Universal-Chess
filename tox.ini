[tox]
envlist = py39, py310, py311, py312, py314
skipsdist = true
requires =
    tox>=4.10

[testenv]
description = Run unit tests with pytest under {envname}
deps =
    -r src/universalchess/setup/requirements.txt
    pytest>=7.4
    pytest-asyncio>=0.23
    # Test-only: the packaging tests parse dependabot.yml and the workflows.
    pyyaml>=6.0
commands =
    pytest {posargs}
passenv =
    PYTHONPATH
setenv =
    PYTHONPATH = {toxinidir}/src
