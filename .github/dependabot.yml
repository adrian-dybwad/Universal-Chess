# Dependabot keeps pinned dependency versions current so upgrades and
# deprecations surface as reviewable PRs instead of silently drifting until a
# warning or hard failure appears (e.g. the Actions Node 20 -> Node 24 runner
# change). Each ecosystem is grouped so a run opens one PR rather than many.
version: 2
updates:
  # GitHub Actions used by every workflow under .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # React web-app dependencies (npm lockfile lives beside package.json).
  - package-ecosystem: npm
    directory: /src/universalchess/web-app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  # Python dependencies. pyproject.toml declares no [project] deps (ruff/bandit
  # config only), so the requirements.txt files are the update targets.
  #
  # setup/pinned holds the hash-pinned closure vendored into the .deb. Listing it
  # is what puts those versions in the dependency graph, which is where
  # vulnerability alerts come from -- without it the pins age unwatched, since
  # setup/requirements.txt names distributions without versions and so can never
  # be reported as vulnerable.
  #
  # Expect Dependabot's own pull requests against setup/pinned to fail CI when a
  # bump changes the transitive closure: it re-pins and re-hashes the targeted
  # distribution alone, which breaks the --require-hashes install the postinst
  # performs. Treat those as notifications and run the refresh workflow, which
  # re-resolves the whole closure coherently.
  - package-ecosystem: pip
    directories:
      - /
      - /src/universalchess/setup
      - /src/universalchess/setup/pinned
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"
