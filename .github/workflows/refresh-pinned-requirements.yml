# Regenerates the hash-pinned closure vendored into the .deb.
#
# Pinning stopped the postinst from running whatever PyPI served that day; it
# also stopped patched versions from arriving on their own. Dependabot reports
# when a pin is vulnerable but cannot produce the fix: its pip updater re-pins
# and re-hashes the one distribution it targets and leaves that package's
# transitives behind, which fails the --require-hashes install the postinst
# performs. Re-resolving the whole closure is the only coherent update, so that
# is what runs here.
#
# The schedule keeps pins from ageing between advisories. workflow_dispatch is
# the response to a critical one:
#
#     gh workflow run refresh-pinned-requirements.yml
name: Refresh pinned requirements

on:
  schedule:
    # Mondays 05:00 UTC, clear of the nightly build.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          # Must match RESOLUTION_PYTHON in the resolver, which refuses to run
          # under anything else: markers resolved against a newer interpreter can
          # omit a distribution bookworm needs.
          python-version: '3.11'

      - name: Re-resolve the pinned closure
        run: python scripts/update-wheels-lock.py

      - name: Verify the regenerated closure installs offline
        run: |
          # Runs before the pull request is opened, not after, because a closure
          # that cannot resolve offline is not worth review. Pull requests pushed
          # with GITHUB_TOKEN do not trigger workflows, so this is the only place
          # the check is guaranteed to run for a bump.
          python scripts/update-wheels-lock.py --verify

      - name: Open a pull request if the pins moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCK: src/universalchess/setup/pinned/requirements.txt
        run: |
          set -euo pipefail

          if git diff --quiet -- "$LOCK"; then
            echo "Pinned requirements are already current; nothing to open."
            exit 0
          fi

          # The message is built by a script rather than inline here because what
          # has to be right about it cannot be seen by reading it: the
          # `Changelog: none` declaration counts only as a git trailer in the last
          # paragraph, and a lock diff's --hash backslashes join the lines naming
          # the versions if they reach a heredoc. Both are covered by
          # src/universalchess/tests/test_pinned_refresh_workflow.py.
          #
          # A refusal (the lock changed but no pin moved) fails this step through
          # pipefail, which is the intent: that means the generated header was
          # edited without the lock being regenerated, and calling it a refresh
          # would misdescribe it.
          MESSAGE=/tmp/refresh-commit-message.md
          git diff --unified=0 -- "$LOCK" \
            | ./scripts/pinned-refresh-commit-message.sh > "$MESSAGE"

          echo "Commit message:"
          cat "$MESSAGE"

          BRANCH="deps/refresh-pinned-requirements"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$LOCK"
          git commit -F "$MESSAGE"

          # Force-push the branch: a superseded proposal is noise, and the branch
          # holds nothing but generated output that this job just reproduced.
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "Existing pull request updated."
            exit 0
          fi

          # Indented to the block scalar's level so YAML strips it back to column
          # zero, which is where the heredoc terminator has to land.
          cat > /tmp/pr-body.md <<'BODY'
          Regenerated by `scripts/update-wheels-lock.py` under Python 3.11, the
          interpreter bookworm ships.

          The whole closure was re-resolved rather than individual pins edited, so
          the versions and hashes are coherent with each other. `--verify` built
          the wheelhouse from this lock and resolved `requirements.txt` against it
          offline, the way the postinst does, before this pull request was opened.

          The commit declares `Changelog: none`, which holds for routine version
          drift: a board cannot observe which version of a vendored library it
          runs. If a pin here resolves an advisory or changes behaviour a board
          can show, write a changelog entry before merging -- the generator cannot
          tell those apart.

          Pushed with `GITHUB_TOKEN`, so the usual checks did not start on their
          own. Close and reopen the pull request to run them.
          BODY

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "Refresh the pinned Python closure" \
            --body-file /tmp/pr-body.md
