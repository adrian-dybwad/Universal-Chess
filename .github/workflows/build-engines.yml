# Build chess engine binaries for ARM architectures
# These are uploaded as release assets for fast installation on Raspberry Pi
name: Build Engines

on:
  # Trigger on release creation to attach binaries
  release:
    types: [published]
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      engines:
        description: 'Engines to build (comma-separated, or "all")'
        required: false
        default: 'all'

permissions: {}

# The set of engines and their per-arch build commands lives in
# scripts/engines/ci-build-engines.sh (the single source of truth, shared by the
# arm64 and armhf jobs below). Stockfish is a system package and is not built here.

jobs:
  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Build engines in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/debian:bookworm \
            bash -c '
              set -e
              apt-get update
              apt-get install -y build-essential git clang make meson ninja-build libopenblas-dev wget curl ca-certificates bc gawk golang
              bash /workspace/scripts/engines/ci-build-engines.sh arm64
            '
      
      - name: Package ARM64 binaries
        run: |
          cd engine-binaries
          tar -czvf engines-arm64.tar.gz arm64/
          sha256sum engines-arm64.tar.gz > engines-arm64.tar.gz.sha256
      
      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engines-arm64
          path: |
            engine-binaries/engines-arm64.tar.gz
            engine-binaries/engines-arm64.tar.gz.sha256

  build-armhf:
    name: Build ARM32 (armhf)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      
      - name: Build engines in ARM32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm32v7/debian:bookworm \
            bash -c '
              set -e
              apt-get update
              apt-get install -y build-essential git clang make meson ninja-build libopenblas-dev wget curl ca-certificates bc gawk golang
              bash /workspace/scripts/engines/ci-build-engines.sh armhf
            '
      
      - name: Package ARM32 binaries
        run: |
          cd engine-binaries
          tar -czvf engines-armhf.tar.gz armhf/
          sha256sum engines-armhf.tar.gz > engines-armhf.tar.gz.sha256
      
      - name: Upload ARM32 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engines-armhf
          path: |
            engine-binaries/engines-armhf.tar.gz
            engine-binaries/engines-armhf.tar.gz.sha256

  upload-to-release:
    name: Upload to Release
    needs: [build-arm64, build-armhf]
    runs-on: ubuntu-latest
    # Runs for both a real release publish and a manual dispatch. Dispatch is the
    # supported way to (re)publish engine binaries on demand; a `schedule:` could
    # be added here later if periodic rebuilds are wanted (the engine build is a
    # multi-hour QEMU job, so it is intentionally not automatic).
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
      - name: Download ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: engines-arm64
          path: ./artifacts
      
      - name: Download ARM32 artifacts
        uses: actions/download-artifact@v4
        with:
          name: engines-armhf
          path: ./artifacts

      # Publish to a STABLE, dedicated prerelease (tag: engines-latest) rather
      # than the rotating nightly releases. The device's installer scans all
      # releases for engines-<arch>.tar.gz, so a fixed tag means it always finds
      # the current binaries regardless of nightly pruning. softprops creates the
      # release if missing and replaces same-named assets on re-publish. A nightly
      # release cannot be used because it is created with GITHUB_TOKEN (which does
      # not trigger this workflow) and its tag changes daily.
      - name: Publish engine binaries to stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engines-latest
          name: "Engine Binaries (latest)"
          prerelease: true
          body: |
            Prebuilt chess-engine binaries consumed by the on-device installer
            (`engines-<arch>.tar.gz`). Auto-published by the Build Engines
            workflow; not a product release.
          files: |
            artifacts/engines-arm64.tar.gz
            artifacts/engines-arm64.tar.gz.sha256
            artifacts/engines-armhf.tar.gz
            artifacts/engines-armhf.tar.gz.sha256

