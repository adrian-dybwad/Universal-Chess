# Build and verify the .deb package.
#
# Runs on every push/PR (branch builds) to continuously verify the full
# installer assembly - React build + packaging together - and on version tags
# (the release path). The standalone frontend typecheck job lived in test.yml
# but was redundant once this runs on every push: scripts/build.sh runs
# `npm run build` (tsc -b && vite build) inside buildReactApp, so any type error
# fails this job before dpkg-deb packaging.
name: Build Package

on:
  push:
    branches: [main, UniversalChess]
    tags:
      - 'v*'
  pull_request:
    branches: [main, UniversalChess]
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  build:
    name: Build .deb Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/universalchess/web-app/package-lock.json
      
      - name: Extract version
        id: version
        run: |
          # Tag pushes carry the release version; branch/PR builds fall back to
          # the control-file version so the artifact still has a stable name.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -E "^Version:" packaging/deb-root/DEBIAN/control | cut -d' ' -f2)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          # Must match RESOLUTION_PYTHON in the resolver, which refuses to run
          # under anything else. Verifying under a newer interpreter would pass
          # while resolving a different closure than a bookworm board gets.
          python-version: '3.11'

      - name: Verify vendored wheels resolve offline
        run: |
          # The postinst installs the venv with --no-index, so the package must
          # carry every wheel that requirements.txt reaches. The unit tests can
          # only compare the lock against the requirements the package names
          # directly; a missing *transitive* is absent from both and would first
          # appear as a failed install on a board, with no index to fall back to.
          # Building the wheelhouse and resolving against it is what catches that.
          python scripts/update-wheels-lock.py --verify

      - name: Build .deb package
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: universal-chess-${{ steps.version.outputs.version }}
          path: scripts/releases/*.deb
          retention-days: 30

  test:
    name: Test Package Install
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: universal-chess-${{ needs.build.outputs.version }}
          path: ./
      
      - name: Test package metadata
        run: |
          dpkg-deb --info *.deb
          dpkg-deb --contents *.deb | head -50

      - name: Verify React app is packaged
        run: |
          # The web UI ships as a static bundle under /opt/universalchess/web/react-app.
          # Guards against scripts/build.sh silently skipping buildReactApp (e.g. if
          # npm is missing) and shipping a deb without the frontend.
          if ! dpkg-deb --contents *.deb | grep -q 'opt/universalchess/web/react-app/index.html'; then
            echo "ERROR: React app (web/react-app/index.html) missing from package" >&2
            exit 1
          fi
          echo "React app present in package."

      - name: Verify vendored wheels are packaged
        run: |
          # Without these the postinst cannot install the venv at all: it uses
          # --no-index and deliberately has no PyPI fallback. build.sh refuses to
          # produce such a package, so this guards against the package being
          # assembled some other way.
          if ! dpkg-deb --contents *.deb | grep -q 'opt/universalchess/wheels/.*\.whl'; then
            echo "ERROR: no vendored wheels in package; postinst could not install" >&2
            exit 1
          fi
          echo "Vendored wheels present in package:"
          dpkg-deb --contents *.deb | grep 'opt/universalchess/wheels/.*\.whl'
