# Build nightly release from main branch
name: Nightly

on:
  push:
    branches: [main]
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  # Gate the build so a scheduled run does not republish an identical nightly
  # when main has not advanced. push (the tree changed) and workflow_dispatch (an
  # explicit human override) always build; only the cron path is guarded.
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Need history and all nightly tags to compare HEAD against the last
          # published nightly.
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Event '$EVENT_NAME': building unconditionally."
            exit 0
          fi
          # The most recent nightly tag encodes the commit it was built from as
          # its trailing '-<short_sha>' segment. If that matches the current
          # HEAD, main has not advanced since the last nightly, so there is
          # nothing new to publish. Tags sort chronologically by name because the
          # 'nightly-YYYY-MM-DD-HHMMSS-...' prefix is lexically ordered.
          LAST_TAG=$(git tag -l 'nightly-*' --sort=-refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No prior nightly tag: building."
            exit 0
          fi
          LAST_SHA=${LAST_TAG##*-}
          HEAD_SHA=${GITHUB_SHA::7}
          if [ "$LAST_SHA" = "$HEAD_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since $LAST_TAG (HEAD $HEAD_SHA): skipping nightly."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New commits since $LAST_TAG (HEAD $HEAD_SHA): building."
          fi

  build:
    name: Build Nightly
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Full history and tags are required so the release-notes step can diff
          # against the previous nightly tag with `git log`.
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/universalchess/web-app/package-lock.json
      
      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(grep -E "^Version:" packaging/deb-root/DEBIAN/control | cut -d' ' -f2)
          # Build stamp carries date AND time so same-day rebuilds order
          # chronologically by the tag itself. The dashed date keeps the tag and
          # release name readable (nightly-2026-06-19-031500-<sha>); the update
          # checker compares only the digits of the pre-sha portion, so the
          # dashes are cosmetic to ordering. Captured in ONE call so the date and
          # time cannot straddle midnight, then split into the dashed date for
          # the release name and the day-prune pattern. GitHub runners are UTC.
          BUILD_STAMP=$(date +%Y-%m-%d-%H%M%S)  # e.g. 2026-06-19-031500
          DATE_TAG=${BUILD_STAMP%-*}            # e.g. 2026-06-19 (release name + day prune)
          SHORT_SHA=${GITHUB_SHA::7}
          # Simple version for filename, full version for metadata
          NIGHTLY_VERSION="${BASE_VERSION}-nightly"
          FULL_VERSION="${BASE_VERSION}-nightly.${BUILD_STAMP}.${SHORT_SHA}"
          echo "version=$NIGHTLY_VERSION" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag_name=nightly-${BUILD_STAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          
          # Update control file with nightly version (simplified)
          sed -i "s/^Version: .*/Version: ${NIGHTLY_VERSION}/" packaging/deb-root/DEBIAN/control
          echo "Building nightly version: $NIGHTLY_VERSION (commit: $SHORT_SHA)"
      
      - name: Build .deb package
        env:
          # Record the release tag as the installed version so the update
          # checker can compare the installed nightly against release tags.
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
      
      # Users prepare an SD card before the board has any network, so this tool
      # runs on their own machine and cannot come from the .deb. Publishing it
      # as a single generated file is what lets them download one thing.
      #
      # Must run after build.sh, which starts by deleting scripts/releases.
      # Kept in step with the identical block in release.yml.
      - name: Build SD card setup tool
        run: |
          python3 tools/sd-card-setup/build_single_file.py \
            -o scripts/releases/enable_usb_gadget.py

      - name: Generate checksums
        run: |
          cd scripts/releases
          sha256sum *.deb enable_usb_gadget.py > SHA256SUMS.txt

      # Boards verify this signature against the keyring shipped in the package
      # before installing an update. Nightly is the channel most boards track, so
      # an unsigned build here would stall updates for them; fail the build rather
      # than publish something no board will install.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not configured. Boards" \
                 "verify SHA256SUMS.txt against the keyring in the package and" \
                 "will refuse an unsigned release. See" \
                 "packaging/deb-root/opt/universalchess/keys/README.md"
            exit 1
          fi
          printf '%s' "${RELEASE_SIGNING_KEY}" | gpg --batch --quiet --import
          cd scripts/releases
          gpg --batch --yes --armor --detach-sign \
              --pinentry-mode loopback \
              --passphrase "${RELEASE_SIGNING_PASSPHRASE}" \
              --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: Generate release notes
        env:
          DATE_TAG: ${{ steps.version.outputs.date_tag }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BUILT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          # Published nightlies are pruned to one per day (see the day-prune
          # step below), so the changelog must diff against the most recent
          # nightly from a PRIOR day. Same-day builds are excluded here because
          # baselining on an intra-day tag that the prune step then deletes
          # leaves a near-empty changelog that references a now-missing tag.
          PREV_TAG=$(git tag -l 'nightly-*' --sort=-creatordate | grep -v "^nightly-${DATE_TAG}-" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..${COMMIT_SHA}" --no-merges --pretty=format:'- %s')
            CHANGES_HEADING="### Changes since ${PREV_TAG}"
          else
            # First nightly: no prior tag to diff against, fall back to recent history.
            CHANGES=$(git log -n 20 --no-merges --pretty=format:'- %s')
            CHANGES_HEADING="### Recent changes"
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- No code changes since the previous nightly."
          fi

          # The static install body lives in a template file so this workflow's
          # YAML literal block stays valid (no column-0 heredoc lines). Dynamic
          # values are substituted with `|` as the sed delimiter because the
          # repository slug contains a `/`.
          {
            printf '## Nightly Build - %s\n\n' "$DATE_TAG"
            printf '**This is an automated build from the latest development branch.**\n'
            printf '**Not recommended for production use.**\n\n'
            printf -- '- Base version: %s\n' "$BASE_VERSION"
            printf -- '- Commit: %s\n' "$COMMIT_SHA"
            printf -- '- Built: %s\n\n' "$BUILT_TIMESTAMP"
            printf '%s\n\n' "$CHANGES_HEADING"
            printf '%s\n\n' "$CHANGES"
            sed -e "s|__REPOSITORY__|${REPOSITORY}|g" \
                -e "s|__TAG_NAME__|${TAG_NAME}|g" \
                -e "s|__NIGHTLY_VERSION__|${NIGHTLY_VERSION}|g" \
                .github/release-notes/nightly-body.md
          } > release_notes.md
      
      - name: Delete existing releases for today
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe  # v0.3.4
        with:
          keep_latest: 0
          # Match the date portion of the timestamped tag (nightly-YYYY-MM-DD-...)
          # so the day's prior release is pruned before the new one is published.
          delete_tag_pattern: nightly-${{ steps.version.outputs.date_tag }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create dated nightly release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Nightly Build - ${{ steps.version.outputs.date_tag }}"
          prerelease: true
          files: |
            scripts/releases/*.deb
            scripts/releases/enable_usb_gadget.py
            scripts/releases/SHA256SUMS.txt
            scripts/releases/SHA256SUMS.txt.asc
          body_path: release_notes.md
      
      - name: Delete old nightly releases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe  # v0.3.4
        with:
          keep_latest: 7
          delete_tag_pattern: nightly-
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

