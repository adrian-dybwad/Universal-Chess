# Build nightly release from main branch
name: Nightly

on:
  push:
    branches: [main]
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  build:
    name: Build Nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/universalchess/web-app/package-lock.json
      
      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(grep -E "^Version:" packaging/deb-root/DEBIAN/control | cut -d' ' -f2)
          # Build stamp carries date AND time so same-day rebuilds order
          # chronologically by the tag itself (the update checker compares the
          # tag's digits positionally). Captured in one call so the date and
          # time cannot straddle midnight. GitHub runners are UTC.
          BUILD_STAMP=$(date +%Y%m%d-%H%M%S)   # e.g. 20260619-031500
          DATE_PREFIX=${BUILD_STAMP%-*}        # e.g. 20260619 (used to prune the day)
          DATE_TAG=$(date +%Y-%m-%d)           # human-readable, release name only
          SHORT_SHA=${GITHUB_SHA::7}
          # Simple version for filename, full version for metadata
          NIGHTLY_VERSION="${BASE_VERSION}-nightly"
          FULL_VERSION="${BASE_VERSION}-nightly.${DATE_PREFIX}.${SHORT_SHA}"
          echo "version=$NIGHTLY_VERSION" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "date_prefix=$DATE_PREFIX" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag_name=nightly-${BUILD_STAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          
          # Update control file with nightly version (simplified)
          sed -i "s/^Version: .*/Version: ${NIGHTLY_VERSION}/" packaging/deb-root/DEBIAN/control
          echo "Building nightly version: $NIGHTLY_VERSION (commit: $SHORT_SHA)"
      
      - name: Build .deb package
        env:
          # Record the release tag as the installed version so the update
          # checker can compare the installed nightly against release tags.
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
      
      - name: Generate checksums
        run: |
          cd scripts/releases
          sha256sum *.deb > SHA256SUMS.txt
      
      - name: Delete existing releases for today
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 0
          # Match the date portion of the timestamped tag (nightly-YYYYMMDD-...)
          # so the day's prior release is pruned before the new one is published.
          delete_tag_pattern: nightly-${{ steps.version.outputs.date_prefix }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create dated nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Nightly Build - ${{ steps.version.outputs.date_tag }}"
          prerelease: true
          files: |
            scripts/releases/*.deb
            scripts/releases/SHA256SUMS.txt
          body: |
            ## Nightly Build - ${{ steps.version.outputs.date_tag }}
            
            **This is an automated build from the latest development branch.**
            **Not recommended for production use.**
            
            - Base version: ${{ steps.version.outputs.base_version }}
            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}
            
            ## Prepare a new SD card

            Start clean on a new SD card using the Raspberry Pi Imager. Do not reuse
            the original card from the Centaur -- keep it safe, you may want it later.

            1. In the Pi Imager, choose Raspberry Pi OS (32-bit) **Trixie**, with no
               apps or desktop (Lite).
            2. In the Imager's advanced settings, configure the hostname, a user and
               password (any username works, you are not limited to `pi` -- just
               remember the password), Wi-Fi credentials, and enable SSH. Set any
               other options you like.
            3. Write the image, insert the card into the Pi, and power it on. With
               Wi-Fi configured correctly the Pi usually joins your network within a
               minute or two. No screen or keyboard required.
            4. SSH into the Pi, then update the base system:

            ```bash
            sudo apt update && sudo apt upgrade -y
            ```

            ## Installation
            
            Download and install on your Raspberry Pi:
            
            ```bash
            # Download the .deb file (run on the Pi)
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/universal-chess_${{ steps.version.outputs.version }}_all.deb
            
            # Install -- apt resolves dependencies in one step (./ prefix required).
            # --reinstall is needed because every nightly shares the version "2.0.0-nightly".
            sudo apt-get install -y --reinstall ./universal-chess_${{ steps.version.outputs.version }}_all.deb
            ```
            
            Or download the `.deb` file from the Assets section below and transfer it to your Pi.

            When the install finishes, reboot the Pi and it should come up running
            Universal Chess.
            
            ## Switch to Stable
            
            To switch back to stable releases:
            ```bash
            sudo apt-get install --reinstall universal-chess
            ```
      
      - name: Delete old nightly releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 7
          delete_tag_pattern: nightly-
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

