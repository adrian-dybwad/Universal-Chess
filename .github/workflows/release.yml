# Create GitHub Release when a version tag is pushed
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/universalchess/web-app/package-lock.json
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Build .deb package
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
      
      # Users prepare an SD card before the board has any network, so this tool
      # runs on their own machine and cannot come from the .deb. Publishing it
      # as a single generated file is what lets them download one thing.
      - name: Build SD card setup tool
        run: |
          python3 tools/sd-card-setup/build_single_file.py \
            -o scripts/releases/enable_usb_gadget.py

      - name: Generate checksums
        run: |
          cd scripts/releases
          sha256sum *.deb enable_usb_gadget.py > SHA256SUMS.txt

      # Boards verify this signature against the keyring shipped in the package
      # before installing an update, so an unsigned release cannot be installed.
      # Fail loudly when the key is absent: publishing unsigned would leave every
      # board refusing the update, recoverable only by installing a .deb by hand.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          KEYRING: packaging/deb-root/opt/universalchess/keys/release-signing.gpg
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not configured. Boards" \
                 "verify SHA256SUMS.txt against the keyring in the package and" \
                 "will refuse an unsigned release. See" \
                 "packaging/deb-root/opt/universalchess/keys/README.md"
            exit 1
          fi
          # The key carries no passphrase. Encrypting it would mean storing the
          # passphrase in the same secret store, which protects against nothing
          # and has already cost two releases.
          printf '%s' "${RELEASE_SIGNING_KEY}" | gpg --batch --quiet --import

          # Boards accept only the key in the keyring inside the package. Were
          # the secret ever to hold a different one, signing would succeed, the
          # release would publish, and every board would refuse it while CI
          # stayed green. Nothing downstream compares the two, so compare here.
          expected="$(gpg --batch --with-colons --show-keys "${KEYRING}" \
                      | awk -F: '/^fpr:/{print $10; exit}')"
          imported="$(gpg --batch --with-colons --list-secret-keys \
                      | awk -F: '/^fpr:/{print $10; exit}')"
          if [ "${imported}" != "${expected}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not the key boards trust." \
                 "Imported ${imported:-<none>}, but ${KEYRING} carries" \
                 "${expected:-<none>}. Signing with it would publish a release" \
                 "every board refuses. See that file's README to rotate keys."
            exit 1
          fi
          echo "Signing with ${imported}, which matches the shipped keyring."

          cd scripts/releases
          gpg --batch --yes --armor --detach-sign \
              --output SHA256SUMS.txt.asc SHA256SUMS.txt
          # Verify what was produced, so a broken signature fails the build here
          # rather than on every board that tries to update.
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-artifacts
          path: |
            scripts/releases/*.deb
            scripts/releases/enable_usb_gadget.py
            scripts/releases/SHA256SUMS.txt
            scripts/releases/SHA256SUMS.txt.asc

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-artifacts
          path: ./artifacts
      
      - name: Build release notes
        id: changelog
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Stable releases are curated, so the change summary comes from the
          # hand-maintained CHANGELOG.md section rather than raw git history.

          # Fail loudly rather than ship a stable release with wrong or missing
          # notes. The header line carries the release-readiness marker, so it is
          # checked separately from the section body (awk skips the header line).
          HEADER=$(grep -m1 "^## \[${VERSION}\]" CHANGELOG.md || true)
          if [ -z "$HEADER" ]; then
            echo "::error::No CHANGELOG.md section found for '## [${VERSION}]'. Add a changelog entry before tagging."
            exit 1
          fi
          if echo "$HEADER" | grep -qi 'unreleased'; then
            echo "::error::CHANGELOG.md section for ${VERSION} is still marked 'Unreleased'. Set the release date before tagging."
            exit 1
          fi

          # Capture the section body: everything after the version header up to
          # the next top-level '## [' heading.
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md > changelog_section.md
          if [ -z "$(tr -d '[:space:]' < changelog_section.md)" ]; then
            echo "::error::CHANGELOG.md section for ${VERSION} is empty. Document the changes before tagging."
            exit 1
          fi

          # The change summary goes above the install instructions; the static
          # install body lives in a template file so this workflow's YAML literal
          # block stays valid (no column-0 heredoc lines).
          {
            printf '## Changes in %s\n\n' "$VERSION"
            cat changelog_section.md
            printf '\n---\n\n'
            sed -e "s|__VERSION__|${VERSION}|g" .github/release-notes/stable-body.md
          } > release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: Universal Chess v${{ needs.build.outputs.version }}
          generate_release_notes: false
          files: |
            artifacts/*.deb
            artifacts/enable_usb_gadget.py
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.asc
          body_path: release_notes.md

