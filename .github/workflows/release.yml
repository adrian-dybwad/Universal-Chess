# Create GitHub Release when a version tag is pushed
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/universalchess/web-app/package-lock.json
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Build .deb package
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
      
      - name: Generate checksums
        run: |
          cd scripts/releases
          sha256sum *.deb > SHA256SUMS.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            scripts/releases/*.deb
            scripts/releases/SHA256SUMS.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts
      
      - name: Build release notes
        id: changelog
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Stable releases are curated, so the change summary comes from the
          # hand-maintained CHANGELOG.md section rather than raw git history.

          # Fail loudly rather than ship a stable release with wrong or missing
          # notes. The header line carries the release-readiness marker, so it is
          # checked separately from the section body (awk skips the header line).
          HEADER=$(grep -m1 "^## \[${VERSION}\]" CHANGELOG.md || true)
          if [ -z "$HEADER" ]; then
            echo "::error::No CHANGELOG.md section found for '## [${VERSION}]'. Add a changelog entry before tagging."
            exit 1
          fi
          if echo "$HEADER" | grep -qi 'unreleased'; then
            echo "::error::CHANGELOG.md section for ${VERSION} is still marked 'Unreleased'. Set the release date before tagging."
            exit 1
          fi

          # Capture the section body: everything after the version header up to
          # the next top-level '## [' heading.
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md > changelog_section.md
          if [ -z "$(tr -d '[:space:]' < changelog_section.md)" ]; then
            echo "::error::CHANGELOG.md section for ${VERSION} is empty. Document the changes before tagging."
            exit 1
          fi

          # The change summary goes above the install instructions; the static
          # install body lives in a template file so this workflow's YAML literal
          # block stays valid (no column-0 heredoc lines).
          {
            printf '## Changes in %s\n\n' "$VERSION"
            cat changelog_section.md
            printf '\n---\n\n'
            sed -e "s|__VERSION__|${VERSION}|g" .github/release-notes/stable-body.md
          } > release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Universal Chess v${{ needs.build.outputs.version }}
          generate_release_notes: false
          files: |
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
          body_path: release_notes.md

