# Run tests on every push and pull request
name: Test

on:
  push:
    branches: [main, UniversalChess]
  pull_request:
    branches: [main, UniversalChess]

permissions: {}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install requirements, but skip RPi-specific packages that won't work on x86.
          # bleak, casttube and ndjson are deliberately absent: nothing imports
          # bleak, and the other two are transitives of berserk/pychromecast.
          # See setup/requirements.txt and test_dependency_manifest.py.
          pip install berserk pyserial chess
          # PyYAML is a test-only dependency: the packaging tests read
          # dependabot.yml and the workflows to check that the pinned Python
          # closure stays covered by alerting and by the refresh job.
          pip install pyyaml
          # Web-app deps so the Flask web-security tests run (otherwise they
          # importorskip and the regressions they guard go unchecked in CI).
          pip install flask werkzeug sqlalchemy Pillow
          # TLS/CA endpoints use cryptography at runtime (PEM->DER for the iOS
          # mobileconfig); install it so the tls and ca-endpoint tests run.
          pip install cryptography
          # segno renders the /ca.pem?qr=1 QR code phones scan to install the
          # CA. Without it that test skipped here as well as locally, so the
          # endpoint had no coverage anywhere and a broken assertion in it went
          # unnoticed.
          pip install segno
          # System telemetry (board.system_info) reads CPU/memory/disk/uptime
          # via psutil; install it so the system_info and About/stats tests run
          # (including the real-collection smoke test).
          pip install psutil
          # Install mock packages for RPi hardware (tests mock these anyway)
          pip install fake-rpi || true
      
      - name: Run tests
        run: |
          pytest -v --tb=short
        env:
          PYTEST_CURRENT_TEST: "true"
          PYTHONPATH: ${{ github.workspace }}/src
