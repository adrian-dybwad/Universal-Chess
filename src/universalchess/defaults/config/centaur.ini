[system]
debug_serial = False
# Device OS timezone (IANA name, e.g. Europe/Oslo). Applied to the system clock
# via the uc-set-timezone helper. Game timestamps are always stored in UTC and
# are unaffected by this; it only changes the device's local wall-clock display.
timezone = UTC
# Device UI language (locale code, e.g. en, es, de, ja). The single device-wide
# language preference: selects which translations the board menus, e-paper
# widgets, and web app render, and the language the AI coach writes in.
ui_language = en

[centaur]
# Original Centaur launch mode. False = translate mode (default): centaur runs
# under the display shim and Universal Chess re-renders its frames onto whatever
# panel is fitted. True = direct mode: UC releases the panel and centaur drives
# it natively (only correct when the fitted panel matches centaur's build).
direct_mode = False

